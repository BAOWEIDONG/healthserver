<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>北大国际医院 · 大巴到院预约</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="hero">
  <div class="brand">
    <svg class="cross" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="18" rx="1.5" fill="#fff"/><rect x="3" y="9" width="18" height="6" rx="1.5" fill="#fff"/></svg>
    <div>
      <div class="kicker">北大国际医院 · 到院服务</div>
      <h1>大巴到院 · 医疗项目预约</h1>
    </div>
  </div>
  <p class="sub">乘大巴直达医院，六大医疗项目任您预约。先选班车班期，再选体验项目。</p>
</div>

<div class="steps">
  <div class="step on" id="step1">1 选班车</div>
  <div class="step" id="step2">2 选项目</div>
  <div class="step" id="step3">3 填信息</div>
</div>

<div class="wrap">

  <!-- 视图1：选班车 -->
  <section class="block" id="view-trips">
    <div class="block-title">选择班车班期 <span class="hint">每周 1~2 班 · 40座/班</span></div>
    <div id="trip-list"></div>
    <div class="empty" id="trip-empty" style="display:none">暂无可约班期，请联系您的代理人</div>
  </section>

  <!-- 视图2：选项目 -->
  <section class="block" id="view-projects" style="display:none">
    <div class="block-title">选择体验项目 <span class="hint" id="proj-trip-hint"></span></div>
    <div id="proj-list"></div>
    <button class="btn-primary" id="btn-to-form">下一步 · 填写信息</button>
    <button class="btn-ghost" id="btn-back-trips" style="margin-top:10px">← 重选班车</button>
  </section>

  <!-- 视图3：信息表单 -->
  <section class="block" id="view-form" style="display:none">
    <div class="card">
      <div class="block-title" style="margin-bottom:4px">预约人信息</div>
      <div class="field">
        <label>姓名 <span class="req">*</span></label>
        <input id="f-name" placeholder="与身份证一致" maxlength="20">
      </div>
      <div class="field">
        <label>手机号 <span class="req">*</span></label>
        <input id="f-phone" type="tel" inputmode="numeric" placeholder="11位手机号" maxlength="11">
      </div>
      <div class="field" id="f-id-wrap">
        <label>身份证号 <span class="req" id="f-id-req" style="display:none">*</span> <span style="color:var(--ink-3);font-size:.75rem">(选择黄金雷针项目必填)</span></label>
        <input id="f-id" placeholder="18位身份证号" maxlength="18">
      </div>
    </div>
    <button class="btn-primary" id="btn-submit">确认预约</button>
    <button class="btn-ghost" id="btn-back-projects" style="margin-top:10px">← 重选项目</button>
  </section>

  <!-- 我的预约 -->
  <section class="block" id="view-mine" style="display:none">
    <div class="block-title">我的预约</div>
    <div class="card" style="padding:12px">
      <div class="field" style="margin-bottom:10px">
        <label>手机号查询</label>
        <input id="q-phone" type="tel" inputmode="numeric" placeholder="输入预约时填写的手机号" maxlength="11">
      </div>
      <button class="btn-primary" id="btn-query" style="padding:10px">查询我的预约</button>
    </div>
    <div id="mine-list"></div>
    <div class="empty" id="mine-empty" style="display:none">该手机号暂无预约记录</div>
  </section>
</div>

<!-- 成功弹窗 -->
<div class="modal-mask" id="ok-modal" style="display:none">
  <div class="modal">
    <div style="font-size:2.4rem;line-height:1">✅</div>
    <h3 style="margin-top:8px">预约成功</h3>
    <p id="ok-text"></p>
    <button class="btn-primary" id="ok-close">好的</button>
  </div>
</div>

<div class="tabbar">
  <button class="on" data-tab="book"><span class="ico">🚌</span>预约</button>
  <button data-tab="mine"><span class="ico">📋</span>我的预约</button>
</div>

<script src="js/mock-db.js"></script>
<script src="js/api.js"></script>
<script src="js/client.js"></script>
</body>
</html>
